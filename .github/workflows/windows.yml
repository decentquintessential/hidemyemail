# Builds and tests the Windows and Mac apps, then publishes both in one release.
# (The file keeps its old name so release numbers keep counting up for the updater.)
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]  # documentation changes don't need a new release
  workflow_dispatch:

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  PYI_ARGS: >-
    --noconfirm --onefile --paths .
    --collect-submodules pyicloud
    --collect-submodules keyring.backends
    --collect-data pyicloud
    --collect-data fido2
    --copy-metadata pyicloud
    --copy-metadata keyring

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r windows/requirements.txt pillow

      - name: Make app icon
        run: python windows/make_icon.py build/icon.ico

      - name: Stamp version
        shell: pwsh
        run: Set-Content windows/_version.py "APP_VERSION = `"$env:APP_VERSION`""

      - name: Build HideMyEmail.exe
        shell: pwsh
        run: pyinstaller $env:PYI_ARGS.Split(" ") --windowed --disable-windowed-traceback --icon build/icon.ico --name HideMyEmail windows/hide_my_email.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Test the installer
        timeout-minutes: 8
        shell: pwsh
        run: |
          $p = Start-Process dist\HideMyEmail-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\Hide My Email\HideMyEmail.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Hide My Email.lnk"
          if (-not (Test-Path $exe)) { throw "App not installed at $exe" }
          if (-not (Test-Path $lnk)) { throw "No Start-menu shortcut at $lnk" }
          "Installed: $exe"
          "Start-menu shortcut: $lnk"

          # Install again exactly as the in-app updater does; the installer should reopen the app.
          # Wait for the installer only: Start-Process -Wait would also wait for the app it reopens.
          $p = Start-Process dist\HideMyEmail-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/RELAUNCH=1" -PassThru
          if (-not $p.WaitForExit(180000)) { throw "Update install did not finish within 3 minutes" }
          if ($p.ExitCode -ne 0) { throw "Update install exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          $running = Get-Process HideMyEmail -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          if (-not $running) { throw "The installer did not reopen the app after updating" }
          "Update install reopened the app (pid $($running[0].Id))"
          $running | Stop-Process -Force

      - uses: actions/upload-artifact@v7
        with:
          name: HideMyEmail-windows
          path: dist/HideMyEmail-Setup.exe

      - name: Self-test the .exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process dist\HideMyEmail.exe -ArgumentList "--selftest", "selftest" -PassThru
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            Get-Process HideMyEmail -ErrorAction SilentlyContinue | Stop-Process -Force
            Get-Content selftest\*.txt -ErrorAction SilentlyContinue
            throw "Self-test did not finish within 2 minutes"
          }
          Get-Content selftest\report.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      # A windowed .exe can't print startup errors, so on failure rebuild as a
      # console app and run it to show what went wrong.
      - name: Diagnose with a console build
        if: failure()
        timeout-minutes: 6
        shell: pwsh
        run: |
          pyinstaller $env:PYI_ARGS.Split(" ") --console --name HideMyEmailDebug --distpath dist-debug windows/hide_my_email.py *> $null
          $p = Start-Process dist-debug\HideMyEmailDebug.exe -ArgumentList "--selftest", "diag" -PassThru -NoNewWindow -RedirectStandardOutput diag-out.txt -RedirectStandardError diag-err.txt
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; "TIMEOUT" }
          "exit: $($p.ExitCode)"
          Get-Content diag\*.txt, diag-out.txt, diag-err.txt -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest
          path: selftest/

  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build app and disk image
        run: PYTHON=python ./app/build.sh --standalone --dmg

      - name: Test the bundled helper
        run: |
          printf '{"id":1,"cmd":"status"}\n{"id":2,"cmd":"bogus"}\n' \
            | "app/Hide My Email.app/Contents/Resources/hme-helper/hme-helper" | tee helper-out.txt
          grep -q '"id": 1, "ok": true' helper-out.txt
          grep -q "Unknown command" helper-out.txt

      - name: Install from the disk image and launch
        run: |
          hdiutil attach "app/Hide My Email.dmg" -nobrowse -mountpoint /tmp/hme
          test -d "/tmp/hme/Hide My Email.app" && test -L /tmp/hme/Applications
          cp -R "/tmp/hme/Hide My Email.app" /Applications/
          hdiutil detach /tmp/hme
          codesign --verify "/Applications/Hide My Email.app"
          open "/Applications/Hide My Email.app"
          sleep 15
          pgrep -fl "Hide My Email.app/Contents/MacOS/HideMyEmail"
          pgrep -fl "hme-helper/hme-helper"
          cat "$HOME/Library/Application Support/hme/helper.log"
          pkill -f "Hide My Email.app/Contents/MacOS/HideMyEmail" || true

      - name: Name the download
        run: mkdir -p dist && mv "app/Hide My Email.dmg" dist/HideMyEmail-Mac.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: HideMyEmail-mac
          path: dist/HideMyEmail-Mac.dmg

  # The Windows app checks the latest release for updates, so publish only when both builds passed.
  release:
    needs: [windows, mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: HideMyEmail-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" dist/HideMyEmail-Setup.exe dist/HideMyEmail-Mac.dmg \
            --repo "${{ github.repository }}" --title "Hide My Email $APP_VERSION" --latest \
            --notes "Built from ${{ github.sha }}.

          - **Windows:** download **HideMyEmail-Setup.exe**. Installed copies update themselves.
          - **Mac** (Apple Silicon, macOS 14 or later): download **HideMyEmail-Mac.dmg**."
