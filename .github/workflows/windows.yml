# Builds and tests the Windows and Mac apps, then publishes both in one release.
# (The file keeps its old name so release numbers keep counting up for the updater.)
name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]  # documentation changes don't need a new release
  workflow_dispatch:

# A newer push supersedes an older build: cancel the older one so it can't publish
# a lower version as "Latest" after the newer release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  PYI_ARGS: >-
    --noconfirm --onedir --paths .
    --collect-submodules pyicloud
    --collect-submodules keyring.backends
    --collect-data pyicloud
    --collect-data fido2
    --copy-metadata pyicloud
    --copy-metadata keyring

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r windows/requirements.txt pillow

      - name: Make app icon
        run: python windows/make_icon.py build/icon.ico

      - name: Stamp version
        shell: pwsh
        run: Set-Content windows/_version.py "APP_VERSION = `"$env:APP_VERSION`""

      - name: Build HideMyEmail.exe
        shell: pwsh
        run: pyinstaller $env:PYI_ARGS.Split(" ") --windowed --disable-windowed-traceback --icon build/icon.ico --name HideMyEmail windows/hide_my_email.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Test the installer
        timeout-minutes: 8
        shell: pwsh
        run: |
          $p = Start-Process dist\HideMyEmail-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\Hide My Email\HideMyEmail.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Hide My Email.lnk"
          if (-not (Test-Path $exe)) { throw "App not installed at $exe" }
          if (-not (Test-Path $lnk)) { throw "No Start-menu shortcut at $lnk" }
          "Installed: $exe"
          "Start-menu shortcut: $lnk"

          # Update the way "Restart to update" does: the installed (packaged) app starts the
          # installer and quits, the installer reopens it. The reopened app must really start,
          # which it proves by writing last-start.txt (a startup failure shows an error box instead).
          $marker = "$env:APPDATA\HideMyEmail\last-start.txt"
          $p = Start-Process $exe -ArgumentList "--test-update", "dist\HideMyEmail-Setup.exe" -PassThru
          function Show-Evidence {
            "--- Hide My Email / installer processes:"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match "HideMyEmail" } |
              Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize -Wrap | Out-String -Width 300
            "--- Windows with a title:"
            Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id, ProcessName, MainWindowTitle -AutoSize | Out-String -Width 300
            "--- Installer log:"
            Get-Content "dist\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          }
          if (-not $p.WaitForExit(60000)) { Show-Evidence; throw "The app did not hand over to the installer" }
          Remove-Item $marker -ErrorAction SilentlyContinue
          $deadline = (Get-Date).AddMinutes(3)
          while (-not (Test-Path $marker) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          $running = Get-Process HideMyEmail -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          if (-not (Test-Path $marker)) {
            Show-Evidence
            $running | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "After the update the app did not start properly"
          }
          "Updated from inside the app; reopened app started: $(Get-Content $marker)"
          $running | Stop-Process -Force

      - uses: actions/upload-artifact@v7
        with:
          name: HideMyEmail-windows
          path: dist/HideMyEmail-Setup.exe

      - name: Self-test the .exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process dist\HideMyEmail\HideMyEmail.exe -ArgumentList "--selftest", "selftest" -PassThru
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            Get-Process HideMyEmail -ErrorAction SilentlyContinue | Stop-Process -Force
            Get-Content selftest\*.txt -ErrorAction SilentlyContinue
            throw "Self-test did not finish within 2 minutes"
          }
          Get-Content selftest\report.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      # A windowed .exe can't print startup errors, so on failure rebuild as a
      # console app and run it to show what went wrong.
      - name: Diagnose with a console build
        if: failure()
        timeout-minutes: 6
        shell: pwsh
        run: |
          pyinstaller $env:PYI_ARGS.Split(" ") --console --name HideMyEmailDebug --distpath dist-debug windows/hide_my_email.py *> $null
          $p = Start-Process dist-debug\HideMyEmailDebug\HideMyEmailDebug.exe -ArgumentList "--selftest", "diag" -PassThru -NoNewWindow -RedirectStandardOutput diag-out.txt -RedirectStandardError diag-err.txt
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; "TIMEOUT" }
          "exit: $($p.ExitCode)"
          Get-Content diag\*.txt, diag-out.txt, diag-err.txt -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest
          path: selftest/

  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      # One fixed self-signed certificate (stored as repository secrets) signs every
      # release, so the Mac Keychain keeps trusting the app after it updates itself.
      # Without the secrets the build falls back to ad-hoc signing.
      - name: Load signing certificate
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
          SHA1: ${{ secrets.MAC_SIGNING_SHA1 }}
        run: |
          if [ -z "$P12" ]; then echo "No signing certificate configured: signing ad-hoc."; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          # codesign only finds identities in keychains on the search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -p codesigning "$KC" | awk '/\)/ {print $2; exit}')
          if [ -z "$ID" ]; then echo "The certificate was imported but no signing identity was found"; exit 1; fi
          if [ -n "$SHA1" ] && [ "$ID" != "$(echo "$SHA1" | tr -d '[:space:]')" ]; then echo "Certificate fingerprint mismatch"; exit 1; fi
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "Signing with the release certificate (${ID:0:8}…)"

      - name: Build app and disk image
        run: |
          PYTHON=python ./app/build.sh --standalone --dmg
          codesign -dr - "app/Hide My Email.app" 2>&1 | tail -1

      - name: Test the bundled helper
        run: |
          printf '{"id":1,"cmd":"status"}\n{"id":2,"cmd":"bogus"}\n' \
            | "app/Hide My Email.app/Contents/Resources/hme-helper/hme-helper" | tee helper-out.txt
          grep -q '"id": 1, "ok": true' helper-out.txt
          grep -q "Unknown command" helper-out.txt

      - name: Install from the disk image and launch
        run: |
          hdiutil attach "app/Hide My Email.dmg" -nobrowse -mountpoint /tmp/hme
          test -d "/tmp/hme/Hide My Email.app" && test -L /tmp/hme/Applications
          cp -R "/tmp/hme/Hide My Email.app" /Applications/
          hdiutil detach /tmp/hme
          codesign --verify "/Applications/Hide My Email.app"
          open "/Applications/Hide My Email.app"
          sleep 15
          pgrep -fl "Hide My Email.app/Contents/MacOS/HideMyEmail"
          pgrep -fl "hme-helper/hme-helper"
          cat "$HOME/Library/Application Support/hme/helper.log"
          pkill -f "Hide My Email.app/Contents/MacOS/HideMyEmail" || true

      - name: Test updating an older copy
        run: |
          # Pretend an older version is installed, then run the updater's script on the new disk image.
          mkdir -p "$RUNNER_TEMP/old"
          ditto "/Applications/Hide My Email.app" "$RUNNER_TEMP/old/Hide My Email.app"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString 1.0.0" "$RUNNER_TEMP/old/Hide My Email.app/Contents/Info.plist"
          sleep 2 & DUMMY=$!
          /bin/bash app/update.sh $DUMMY "$PWD/app/Hide My Email.dmg" "$RUNNER_TEMP/old/Hide My Email.app"
          cat "$HOME/Library/Application Support/hme/update.log"
          NOW=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$RUNNER_TEMP/old/Hide My Email.app/Contents/Info.plist")
          test "$NOW" = "$APP_VERSION" || { echo "still on $NOW"; exit 1; }
          sleep 10
          pgrep -fl "$RUNNER_TEMP/old/Hide My Email.app/Contents/MacOS/HideMyEmail" || { echo "the updated app did not reopen"; exit 1; }
          echo "Updated 1.0.0 -> $NOW and reopened."
          pkill -f "Hide My Email.app/Contents/MacOS/HideMyEmail" || true

      - name: Name the download
        run: mkdir -p dist && mv "app/Hide My Email.dmg" dist/HideMyEmail-Mac.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: HideMyEmail-mac
          path: dist/HideMyEmail-Mac.dmg

  # The Windows app checks the latest release for updates, so publish only when both builds passed.
  release:
    needs: [windows, mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: HideMyEmail-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" dist/HideMyEmail-Setup.exe dist/HideMyEmail-Mac.dmg \
            --repo "${{ github.repository }}" --title "Hide My Email $APP_VERSION" --latest \
            --notes "Built from ${{ github.sha }}.

          - **Windows:** download **HideMyEmail-Setup.exe**. Installed copies update themselves.
          - **Mac** (Apple Silicon, macOS 14 or later): download **HideMyEmail-Mac.dmg**. Installed copies update themselves."
